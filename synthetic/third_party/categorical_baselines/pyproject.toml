[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdg-categorical-baselines"
version = "0.1.0"
requires-python = ">=3.10"
description = "Categorical-only minority generators with auditable upstream adapters"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.4,<2", "imbalanced-learn==0.14.2", "ctgan==0.12.1", "torch>=2.0,<3", "tqdm", "ml-collections", "timm==0.9.16", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
categorical-baseline = "categorical_baselines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "prepared_data", "audits", "experiments"]
